    <h1>Chai aur Code</h1>
    <button id="stop">stop</button>

<script>
    let header = document.querySelector("h1")
    let button = document.querySelector("#stop")
    let titleChange = function(){
        header.innerHTML = "Edited By Harsh Singh"
    }
    let logger = function(){
        console.log("This is TimeOut")
    }
    let changer = setTimeout(titleChange, 2000);
    setTimeout(logger, 5000);
    addEventListener("click",()=>{
        //requires timeout ID to remove timeout
        clearTimeout(changer)
    })
</script>
